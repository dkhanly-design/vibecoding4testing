<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Đăng nhập · Quản trị Đập Chuột</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="login-wrap">
  <form id="login-form" class="login-card" novalidate>
    <h1>Quản trị Đập Chuột</h1>
    <p id="login-info" class="notice info" hidden></p>
    <div class="field">
      <label for="username">Tên đăng nhập</label>
      <input id="username" class="input" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="password">Mật khẩu</label>
      <input id="password" class="input" type="password" autocomplete="current-password" required>
    </div>
    <p id="login-error" class="notice error" role="alert" hidden></p>
    <button id="login-submit" class="btn btn-primary" type="submit">Đăng nhập</button>
  </form>
</div>
<script src="/admin/login.js"></script>
</body>
</html>
